spring.application.name=ebank-service
server.port=8057

spring.datasource.url=jdbc:h2:mem:accounts-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Do NOT wrap all Feign clients automatically (uncontrolled CB behaviour)
spring.cloud.openfeign.circuitbreaker.enabled=false

# Resilience4J Circuit Breaker — instance customerService (demo thresholds)
resilience4j.circuitbreaker.instances.customerService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.customerService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.customerService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.customerService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.customerService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.customerService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.customerService.registerHealthIndicator=true
# Technical Feign/transport failures count as failures; business miss is ignored (does not open CB)
resilience4j.circuitbreaker.instances.customerService.ignoreExceptions=ma.emsi.microservices.ebankservice.services.CustomerBusinessException
# Limitation: Customer-Service returns HTTP 500 for unknown id — detected by message when possible

# Local Actuator for CB observation (not a production exposure profile)
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
